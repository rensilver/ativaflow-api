spring:
  application:
    name: ativaflow-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      # HikariCP recebe este timeout em milissegundos.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    client:
      connect-timeout: ${ACTIVATION_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${ACTIVATION_PROVIDER_READ_TIMEOUT:5s}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  worker:
    lease-duration: ${WORKER_LEASE_DURATION:30s}
    retry:
      initial-delay: ${WORKER_RETRY_INITIAL_DELAY:1s}
      max-delay: ${WORKER_RETRY_MAX_DELAY:1m}
      jitter-ratio: ${WORKER_RETRY_JITTER_RATIO:0.25}
  activation-provider:
    # Reserva de configuração; a autenticação depende do contrato do provedor.
    api-key: ${ACTIVATION_PROVIDER_API_KEY:}
